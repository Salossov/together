[package]
name = "together-auth"
version = "0.1.0"
edition = "2021"
description = "Auth/skin/update backend for offline-mode Minecraft (NeoForge 1.21.1)"

[dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }

# Web
axum = { version = "0.7", features = ["macros", "multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "limit", "timeout"] }

# DB
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "macros",
    "chrono",
    "uuid",
    "migrate",
    "any",
    "sqlite",
    "postgres",
    "mysql",
] }

# Auth / crypto
jsonwebtoken = "9.3"
bcrypt = "0.15"
uuid = { version = "1.10", features = ["v4", "serde"] }

# Serde
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client (Microsoft / Mineskin)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }

# Image / encoding
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }

# Misc
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
sha2 = "0.10"
hex = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
